# ══════════════════════════════════════════════════════════════
# Smart Notification System — Application Configuration
# ══════════════════════════════════════════════════════════════

spring.application.name=smart-notification-system

# ── Database (H2 In-Memory) ────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:notification_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Server ────────────────────────────────────────────────────
server.port=${PORT:8081}

# ── Discord Integration (Global Default Webhook) ─────────────
discord.webhook.url=${DISCORD_WEBHOOK_URL:https://discord.com/api/webhooks/1502002308383379576/oQP0GZOQEoW50i-0Fkf0Td9aNjjJXDCDzouyFcnfTAhkAK32DAp-U8ByaUA4PfRfyOTC}
